paper_execution:
  enabled: true
  paper_only: true
  real_execution_enabled: false
  use_bid_ask: true
  include_spread: true
  # slippage model: FIXED_POINTS | SPREAD_AND_VOLATILITY_BASED | OBSERVED_SLIPPAGE
  slippage_model: FIXED_POINTS
  slippage_fixed_points: 2.0
  slippage_spread_mult: 0.25
  slippage_vol_mult: 0.05
  # commission model (experimental defaults; mark INCOMPLETE until broker data added)
  commission_mode: PER_LOT_PER_SIDE   # PER_LOT_PER_SIDE | ROUND_TURN | NONE
  commission_per_lot_side: 7.0
  commission_explicitly_configured: false
  swap_enabled: false
  swap_long_per_lot_day: -3.5
  swap_short_per_lot_day: -2.0
  ambiguous_bar_resolution: conservative_sl_first
  persist_every_trade_event: true
